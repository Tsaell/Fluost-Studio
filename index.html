<!doctype html>
<html lang="id" data-theme="sky">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Fluost - Instagram Content & Grid Studio</title>
    <style>
      html, body {
        background-color: var(--bg-base, #0F172A);
        color: var(--text-main, #F8FAFC);
        margin: 0;
        padding: 0;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      }
      #initial-loader {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        gap: 16px;
        text-align: center;
      }
      .spinner {
        width: 42px;
        height: 42px;
        border: 4px solid rgba(255, 255, 255, 0.4);
        border-top-color: #38BDF8;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="initial-loader">
        <div class="spinner"></div>
        <div style="font-weight: 800; font-size: 16px; letter-spacing: 1px;">FLUOST STUDIO</div>
        <div style="font-size: 12px; opacity: 0.8;">Memuat Arsitektur Grid Instagram...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
